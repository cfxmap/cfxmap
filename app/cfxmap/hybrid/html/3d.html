<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D NFT Viewer</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      outline: none;
      /* 确保模型能够接收到所有的交互事件 */
      pointer-events: auto;
      touch-action: none !important;
      z-index: 2;
      position: relative;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 1;
    }
  </style>
  <!-- 引入 Google 的 model-viewer 组件，替换为国内更稳定的 unpkg/cdnjs/jsdelivr 以防网络白屏 -->
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.1.1/dist/model-viewer.min.js"></script>
</head>
<body style="background-color: transparent;">
  <div id="loading">Loading 3D Model...</div>
  <model-viewer id="viewer"
                camera-controls 
                touch-action="none"
                auto-rotate
                rotation-per-second="30deg"
                shadow-intensity="1"
                bounds="tight"
                camera-orbit="0deg 75deg 105%"
                interaction-prompt="auto"
                disable-zoom
                ar>
  </model-viewer>

  <script>
    // 解析 URL 参数获取模型地址
    function getQueryVariable(variable) {
      var query = window.location.search.substring(1);
      var vars = query.split("&");
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split("=");
        if (pair[0] == variable) {
          return decodeURIComponent(pair[1]);
        }
      }
      return (false);
    }

    const url = getQueryVariable("url");
    if (url) {
      const viewer = document.getElementById('viewer');
      viewer.src = url;
      
      // 监听加载事件
      viewer.addEventListener('load', () => {
        const loading = document.getElementById('loading');
        if (loading) loading.style.display = 'none';
      });
      viewer.addEventListener('error', (error) => {
        const loading = document.getElementById('loading');
        if (loading) loading.innerText = 'Failed to load 3D model';
        console.error('Model viewer error:', error);
      });
    } else {
      const loading = document.getElementById('loading');
      if (loading) loading.innerText = 'No 3D model URL provided';
    }
  </script>
</body>
</html>
