<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 移动的渐变遮罩，控制高亮部分的显示 -->
    <linearGradient id="sweep" x1="-100%" y1="-100%" x2="0%" y2="0%">
      <animate attributeName="x1" values="-100%; 200%" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y1" values="-100%; 200%" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 300%" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y2" values="0%; 300%" dur="1.5s" repeatCount="indefinite" />
      <!-- 黑色表示隐藏，白色表示显示 -->
      <stop offset="0%" stop-color="black" stop-opacity="1" />
      <stop offset="50%" stop-color="white" stop-opacity="1" />
      <stop offset="100%" stop-color="black" stop-opacity="1" />
    </linearGradient>

    <mask id="sweep-mask">
      <rect x="0" y="0" width="100" height="100" fill="url(#sweep)" />
    </mask>
  </defs>

  <!-- 1. 底层：半透明暗色的原始 Logo -->
  <image href="data:image/png;base64," x="10" y="10" width="80" height="80" opacity="0.3" />

  <!-- 2. 表层：完全高亮的原始 Logo，被移动的扫光渐变遮罩限制显示范围 -->
  <image href="data:image/png;base64," x="10" y="10" width="80" height="80" mask="url(#sweep-mask)" />
</svg>